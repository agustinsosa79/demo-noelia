<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap"
    />
    <!--app-head-->
    <script>
      // Oculta solo los elementos de entrada hasta que GSAP fija su estado inicial (evita el parpadeo del HTML prerenderizado).
      // Si el JavaScript no llega, se muestran igual a los 4 s. Con reduced-motion no se oculta nada.
      (function (d) {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        d.classList.add("motion");
        setTimeout(function () { d.classList.add("motion-ready"); }, 4000);
      })(document.documentElement);
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
